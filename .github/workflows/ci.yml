name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: jobs only read the repository unless a job widens it below.
permissions:
  contents: read

# A newer push to the same branch / PR cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv publishes no floating major tag (there is no `v10`), so pin a full release.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run --locked ruff check .

      - name: Type check (mypy)
        run: uv run --locked mypy bunnyhole

      - name: Tests (hermetic, no live network)
        run: uv run --locked pytest -q -o addopts=""

      - name: Case board JSON is byte-identical across two runs
        run: |
          uv run --locked pytest -q -o addopts="" tests/test_pi_casework_runtime.py::test_case_board_json_is_byte_identical
          cp /tmp/pi_case_board.json /tmp/pi_case_board_a.json
          uv run --locked pytest -q -o addopts="" tests/test_pi_casework_runtime.py::test_case_board_json_is_byte_identical
          diff -u /tmp/pi_case_board_a.json /tmp/pi_case_board.json

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv publishes no floating major tag (there is no `v10`), so pin a full release.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Install the wheel into a clean venv and smoke-test the entry points
        run: |
          uv venv --python 3.11 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/bunnyhole --help
          /tmp/smoke/bin/python -m bunnyhole --help

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits to scope the scan
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"  # commenting would need pull-requests: write
